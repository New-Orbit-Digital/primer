name: Changelog check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version and changelog move together
        run: bash .github/scripts/changelog-check.sh "origin/${{ github.base_ref }}"
